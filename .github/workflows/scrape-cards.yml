name: Update card catalog

on:
  schedule:
    # Every Wednesday at 17:00 UTC; the gate job only lets the first Wednesday of the month through.
    - cron: '0 17 * * 3'
  workflow_dispatch:
    inputs:
      force_images:
        description: Re-download every card portrait
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: scrape-cards
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Only run on the first Wednesday (or manually)
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%-d)" -gt 7 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the first Wednesday of the month, skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci

      - name: Scrape cards
        env:
          CLASH_ROYALE_API_TOKEN: ${{ secrets.CLASH_ROYALE_API_TOKEN }}
          CLASH_ROYALE_API_BASE_URL: https://proxy.royaleapi.dev
          FORCE_FLAG: ${{ inputs.force_images && '--force' || '' }}
        run: npx tsx scripts/scrape-cards.ts $FORCE_FLAG 2>&1 | tee scrape.log
      - name: Add scrape log to summary
        if: always()
        run: |
          if [ -f scrape.log ]; then
            { echo '### Scrape output'; echo '```'; cat scrape.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for catalog changes
        id: diff
        run: |
          node -e "
            const fs = require('node:fs');
            const { execSync } = require('node:child_process');
            const strip = (text) => { const json = JSON.parse(text); delete json.scrapedAt; return JSON.stringify(json); };
            const before = strip(execSync('git show HEAD:src/data/cards.json', { encoding: 'utf8' }));
            const after = strip(fs.readFileSync('src/data/cards.json', 'utf8'));
            process.exit(before === after ? 0 : 1);
          " && json_changed=false || json_changed=true
          if [ "$json_changed" = true ] || [ -n "$(git status --porcelain public/cards)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog changes besides the scrape timestamp." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm test
          npx tsc -b

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/cards.json public/cards
          git commit -m "Update card catalog ($(date -u +%Y-%m-%d))"
          git push

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy explicitly.
      - name: Deploy
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
